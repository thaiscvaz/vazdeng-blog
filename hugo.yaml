# Hugo config para o blog VazDEng.
# Cloudflare Pages é o host principal. GitHub Actions sobrescreve via --baseURL dinâmico.
# Local dev: --baseURL http://localhost:1313/
baseURL: https://vazdeng.pages.dev/
title: VazDEng
languageCode: pt-BR
defaultContentLanguage: pt
enableRobotsTXT: false  # static/robots.txt é a fonte da verdade
enableGitInfo: false

# Hextra via Hugo Modules
module:
  imports:
    - path: github.com/imfing/hextra

# Permalink estilo AkitaOnRails
permalinks:
  blog: /:year/:month/:day/:slug/

# Taxonomias: tags (pills) + series (paginas /series/<slug>/ com episodios ordenados)
taxonomies:
  tag: tags
  series: series

# Idiomas (sufixo de arquivo .en.md para inglês)
languages:
  pt:
    languageName: Português
    weight: 1
    params:
      # Cronograma da home. Preencher SO com posts realmente agendados — a home
      # esconde o bloco quando a lista esta vazia. As entradas de jun/2026 foram
      # removidas por estarem 3+ meses defasadas (mostravam datas passadas na home).
      upcoming: []
      tracks:
        - color: amber
          label: "DE Produção"
          title: "Anti-padrões reais em batch e streaming."
          sub: "Decisão técnica com SLA, custo e o caso em que falha."
          cta: "Ver últimos"
          sigil: "DE"
        - color: sage
          label: "IA aplicada"
          title: "Agentes e LLMs que aguentam produção."
          sub: "Harness, avaliação, custo e segurança, com o que quebrou no caminho."
          cta: "Ver últimos"
          sigil: "IA"
        - color: lavender
          label: "Zero to Expert"
          title: "Fundamentos antes da ferramenta."
          sub: "Série progressiva de fundamentos, um conceito por episódio."
          cta: "Ver a série"
          href: "series/zero-to-expert/"
          sigil: "ZTE"
  en:
    languageName: English
    weight: 2
    params:
      # Home schedule. Fill ONLY with truly scheduled posts — the home hides the
      # block when empty. Jun/2026 entries removed (3+ months stale, showing past dates).
      upcoming: []
      tracks:
        - color: amber
          label: "DE Production"
          title: "Real anti-patterns in batch and streaming."
          sub: "Technical decisions with SLA, cost and the case where they fail."
          cta: "Latest posts"
          sigil: "DE"
        - color: sage
          label: "Applied AI"
          title: "Agents and LLMs that survive production."
          sub: "Harness, evaluation, cost and security, with what broke along the way."
          cta: "Latest posts"
          sigil: "IA"
        - color: lavender
          label: "Zero to Expert"
          title: "Fundamentals before the tool."
          sub: "Progressive fundamentals series, one concept per episode."
          cta: "See the series"
          href: "series/zero-to-expert/"
          sigil: "ZTE"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# RSS global + saídas
outputs:
  home: [html, rss]
  section: [html, rss]

menu:
  main:
    - name: Comece aqui
      pageRef: /comece
      weight: 1
    - name: Sobre
      pageRef: /sobre
      weight: 2
    - name: Séries
      pageRef: /series
      weight: 3
    - name: GitHub
      weight: 4
      url: https://github.com/thaiscvaz
      params:
        icon: github
    - name: LinkedIn
      weight: 5
      url: https://linkedin.com/in/thacvaz
      params:
        icon: linkedin
    - name: Substack
      weight: 6
      url: https://vazdeng.substack.com/subscribe?utm_source=blog&utm_medium=menu&utm_campaign=fase1
      params:
        icon: substack

params:
  description: "Engenharia de dados e IA em produção, com casos reais e contexto brasileiro. Para quem já sabe o básico e quer ver como funciona de verdade."
  author:
    name: Thais Vaz
    link: https://linkedin.com/in/thacvaz

  # SEO e verificações (descomentar e preencher quando disponível)
  # googleSiteVerification: ""   # Google Search Console: search.google.com/search-console
  # indieAuth: ""                # rel=me link (ex: https://github.com/thaiscvaz)

  # Cloudflare Web Analytics (gratis, sem cookie). Pegar o token em:
  # dash.cloudflare.com > Analytics & Logs > Web Analytics > Add site > copiar "token" do snippet.
  # cloudflareAnalyticsToken: ""

  # Metadados das series (label + cor + descricao curta usada na pagina da serie)
  series_meta:
    ia-foundations:
      label: "IA Foundations"
      color: sage
      sub: "Os fundamentos de engenharia de IA, um mecanismo por episódio."
      sub_en: "AI engineering fundamentals, one mechanism per episode."
    zero-to-expert:
      label: "Zero to Expert"
      color: lavender
      sub: "Fundamentos de engenharia de dados antes da ferramenta."
      sub_en: "Data engineering fundamentals before the tool."
    cripto-chronicles:
      label: "Cripto Chronicles"
      color: rose
      sub: "A saga do agente quant de cripto, capítulo a capítulo."
      sub_en: "The crypto quant agent saga, chapter by chapter."
    segundo-cerebro:
      label: "Segundo Cérebro"
      color: coral
      sub: "Seis anos de Zettelkasten operado por agentes de IA."
      sub_en: "Six years of Zettelkasten operated by AI agents."

  navbar:
    displayTitle: true
    displayLogo: false
    width: normal

  theme:
    default: dark
    displayToggle: true

  page:
    width: normal

  blog:
    list:
      displayTags: false
    article:
      displayPagination: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  # Busca desligada: o navbar custom nunca renderizou o componente e o
  # índice flexsearch era custo de build morto. Religar quando houver UI.
  search:
    enable: false

  # Custom assets
  customCSS:
    - css/custom.css

  images:
    - images/og-default.png

  # upcoming + tracks movidos pra languages.<lang>.params (i18n)

  # Mapping tag -> cor (pills coloridas no archive e cards relacionados)
  track_colors:
    data-engineering: amber
    batch: amber
    streaming: amber
    cripto: rose
    quant: rose
    zero-to-expert: lavender
    fundamentos: lavender
    ia: sage
    agentes: sage
    segundo-cerebro: sage
    machine-learning: sage
    engenharia-de-dados: amber
    ferramentas: amber
    tool-verdict: coral
    airflow: coral
